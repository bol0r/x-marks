<title>X Marks</title>
<meta name="theme-color" content="#11161a">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X Marks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: one-thumb car tool — big category pads at the bottom, list/map above, dark-first */
:root{
  --bg:#11161a; --panel:#1a2127; --line:#2a333b; --fg:#e9eef0; --muted:#8d9aa3;
  --dron:#5ab4ff; --chill:#3fd3a0; --cozy:#ffb347; --danger:#ff6b6b; --ok:#3fd3a0; --mark:#ff5a3c;
  --on-cat:#0b0f12;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5f6; --panel:#ffffff; --line:#d9dfe3; --fg:#141a1f; --muted:#5d6a73;
  --dron:#1677d2; --chill:#0f9b6f; --cozy:#c96f00; --danger:#c62828; --ok:#0f9b6f; --mark:#d93b1f; --on-cat:#ffffff;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f3f5f6; --panel:#ffffff; --line:#d9dfe3; --fg:#141a1f; --muted:#5d6a73;
  --dron:#1677d2; --chill:#0f9b6f; --cozy:#c96f00; --danger:#c62828; --ok:#0f9b6f; --mark:#d93b1f; --on-cat:#ffffff;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
h1{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.gps{font:12px/1.2 var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right;min-width:0}
.gps b{color:var(--fg);font-weight:600}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--cozy)} .dot.bad{background:var(--danger)}
.hint{font-size:13px;color:var(--muted);margin:0 0 6px;line-height:1.4}
.hint button{font:inherit;color:var(--fg);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}

.tools{display:flex;gap:6px;padding-block:6px 10px;align-items:center;flex-wrap:wrap}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--mono);opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.ghost{background:none;border:0;color:var(--muted);font:600 13px var(--body);cursor:pointer;padding:7px 4px}
.ghost[aria-pressed="true"]{color:var(--fg)}

main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.item{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;touch-action:pan-y;transition:transform .2s ease;cursor:pointer;user-select:none;-webkit-user-select:none}
.item .bar{border-radius:3px;background:var(--c)}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cat{font-family:var(--display);font-stretch:115%;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.when{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.addr{margin:4px 0 0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.coords{font:12px var(--mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.dist{color:var(--fg)}
.note{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{font:600 13px var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-decoration:none;cursor:pointer}
textarea{resize:vertical}
textarea,input[type=text]{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:16px var(--body)}

.empty{padding:28px 4px;display:flex;flex-direction:column;gap:14px}
.empty h2{font-family:var(--display);font-stretch:115%;font-size:18px;margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);line-height:1.45}
.steps b{color:var(--fg)}
.formats{font:12px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px;line-height:1.7}

#map{height:100%;min-height:300px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.mapnote{color:var(--muted);font-size:13px;padding:8px 2px}

.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.pad{appearance:none;border:0;border-radius:18px;min-height:96px;background:var(--c);color:var(--on-cat);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:18px;letter-spacing:.02em;text-transform:uppercase;transition:transform .08s}
.pad:active{transform:scale(.96)}
.pad svg{width:30px;height:30px}
.pad[disabled]{opacity:.55}
.pad small{font:600 11px var(--body);text-transform:none;letter-spacing:0;opacity:.75}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));width:min(92vw,560px);box-sizing:border-box;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:1000}
.toast p{margin:0;flex:1;min-width:0;font-weight:600}
.toast small{display:block;font:12px var(--mono);opacity:.7;font-weight:400}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font:600 13px var(--body);cursor:pointer}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:1001}
.sheet .box{background:var(--panel);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--display);font-stretch:115%;margin:0;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:700 14px var(--display);font-stretch:115%;text-transform:uppercase;letter-spacing:.04em;border-radius:10px;padding:10px 6px;border:2px solid var(--c);background:transparent;color:var(--c);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--on-cat)}
.preview{font:13px var(--mono);border-radius:8px;padding:10px;background:var(--bg);border:1px solid var(--line);min-height:20px;line-height:1.5;overflow-wrap:anywhere}
.preview.good{border-color:var(--ok)} .preview.good b{color:var(--ok)}
.preview.bad{border-color:var(--danger);color:var(--fg);font-family:var(--body)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{text-decoration:none;display:inline-flex;align-items:center;font:700 14px var(--body);border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:default}
.msg{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){.pad{transition:none}}
/* ---------- ekran startowy: X Marks the Spot ---------- */
.hx{color:var(--mark)}
.splash{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;cursor:pointer;transition:opacity .35s ease, visibility .35s}
.splash.out{opacity:0;visibility:hidden}
.motto{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.brand{position:relative;display:flex;align-items:center;gap:.12em;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(52px,17vw,96px);letter-spacing:-.02em;text-transform:uppercase;padding-bottom:.16em}
.brand .x{width:.9em;height:.9em;flex:none}
.brand .x path{fill:none;stroke:var(--mark);stroke-width:17;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .32s cubic-bezier(.6,0,.3,1) forwards}
.brand .x path+path{animation-delay:.28s}
.brand .word{opacity:0;transform:translateX(-.15em);animation:slide .4s .45s ease-out forwards}
.trail{position:absolute;left:.04em;right:.02em;bottom:0;height:.075em;background:repeating-linear-gradient(90deg,var(--mark) 0 .16em,transparent .16em .3em);clip-path:inset(0 100% 0 0);animation:reveal .55s .7s ease-in-out forwards}
.rest{font-family:var(--serif);font-style:italic;font-size:clamp(34px,11vw,62px);color:var(--muted);margin-top:.12em;margin-left:auto;opacity:0;animation:fade .45s 1.05s ease-out forwards}
.by{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;opacity:0;animation:fade .4s 1.3s forwards}
.by .bx{color:var(--mark)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slide{to{opacity:1;transform:none}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .brand .x path,.brand .word,.trail,.rest,.by{animation:none;opacity:1;transform:none;stroke-dashoffset:0;clip-path:none}
  .splash{transition:none}
}

/* ---------- widoki: przełącznik, kafelki, przesuwanie ---------- */
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vseg button{font:600 13px var(--body);background:transparent;color:var(--muted);border:0;padding:7px 11px;cursor:pointer}
.vseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip.arch{border-style:dashed}
.name{margin:4px 0 0;font-weight:700;overflow-wrap:anywhere}
.name + .sub{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;align-self:start;background:var(--line)}
.sw{position:relative;border-radius:12px}
.sw-bg{position:absolute;inset:0;border-radius:12px;display:none;justify-content:space-between;align-items:center;padding:0 20px;font:800 13px var(--display);font-stretch:115%;text-transform:uppercase;letter-spacing:.06em;color:var(--on-cat)}
.sw[data-dir] .sw-bg{display:flex}
.sw[data-dir="right"] .sw-bg{background:var(--danger)}
.sw[data-dir="left"] .sw-bg{background:var(--cozy)}
.sw[data-dir="right"] .sw-arch,.sw[data-dir="left"] .sw-del{visibility:hidden}
.sw-bg span{transition:transform .15s}
.sw.armed .sw-bg span{transform:scale(1.15)}
.item.dragging{transition:none}
.sw.gone{transition:opacity .18s;opacity:0}
.swipe-hint{text-align:center;font-size:12px;margin:0 0 2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:12px;align-content:start}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tiles > .empty,.tiles > .hint{grid-column:1/-1}
.tile{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 16%,var(--panel));padding:0;cursor:pointer;text-align:left;font:inherit;color:#fff}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--c)}
.tile .ph svg{width:42%;height:auto;opacity:.6;margin-bottom:22%}
.tile .meta{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8))}
.tile .pill{font:800 10px var(--display);font-stretch:115%;letter-spacing:.08em;text-transform:uppercase;background:var(--c);color:var(--on-cat);border-radius:5px;padding:2px 6px}
.tile .tname{font-weight:700;font-size:14px;line-height:1.25;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .tsub{font:11px var(--mono);color:rgba(255,255,255,.82)}
/* arkusz edycji */
.cover{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:color-mix(in srgb,var(--c) 16%,var(--bg));display:grid;place-items:center;color:var(--c)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ph svg{width:72px;height:72px;opacity:.6}
.cover-acts{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.btn.small{padding:7px 11px;font-size:13px;background:var(--panel)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.meta-line{font:12px var(--mono);color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow textarea{flex:1;min-width:0}
</style>

<div class="splash" id="splash" aria-label="X Marks the Spot. by Dead Net x Claude">
  <div class="motto" aria-hidden="true">
    <span class="brand">
      <svg class="x" viewBox="0 0 100 100"><path pathLength="100" d="M16 14 L84 86"/><path pathLength="100" d="M84 14 L16 86"/></svg><span class="sr">X</span>
      <span class="word">Marks</span>
      <i class="trail"></i>
    </span>
    <span class="rest">the Spot</span>
  </div>
  <p class="by" aria-hidden="true">by Dead Net <span class="bx">x</span> Claude</p>
</div>

<div class="app">
  <header>
    <h1><span class="hx">X</span> Marks</h1>
    <div class="gps" id="gps" aria-live="polite"><i class="dot" id="gpsDot"></i><span id="gpsTxt">GPS: szukam</span></div>
  </header>
  <p class="hint" id="gpsHint" hidden></p>
  <p class="hint" id="backupHint" hidden>Twoje miejsca są tylko na tym telefonie. <button id="backupNow">Zapisz kopię</button></p>

  <div class="tools" role="toolbar" aria-label="Kategorie">
    <button class="chip" data-f="all" aria-pressed="true">Wszystkie<span class="n" id="n-all">0</span></button>
    <button class="chip" data-f="dron" aria-pressed="false">Dron<span class="n" id="n-dron">0</span></button>
    <button class="chip" data-f="chill" aria-pressed="false">Chill<span class="n" id="n-chill">0</span></button>
    <button class="chip" data-f="cozy" aria-pressed="false">Cozy<span class="n" id="n-cozy">0</span></button>
    <button class="chip arch" data-f="arch" aria-pressed="false" id="archChip" hidden>Archiwum<span class="n" id="n-arch">0</span></button>
  </div>
  <div class="tools" role="toolbar" aria-label="Widok" style="padding-top:0">
    <div class="vseg" id="viewSeg">
      <button data-v="list" aria-pressed="true">Lista</button>
      <button data-v="tiles" aria-pressed="false">Kafelki</button>
      <button data-v="map" aria-pressed="false">Mapa</button>
    </div>
    <span class="spacer"></span>
    <button class="ghost" id="sortBtn" aria-pressed="false" hidden>Najbliżej</button>
    <button class="ghost" id="pasteBtn">Dodaj</button>
    <button class="ghost" id="moreBtn">Dane</button>
  </div>

  <main id="main">
    <div class="list" id="items"></div>
    <div id="mapWrap" hidden><div id="map"></div><div class="mapnote" id="mapNote"></div></div>
  </main>

  <nav class="pads" aria-label="Zapisz miejsce, w którym jesteś">
    <button class="pad" data-cat="dron" style="--c:var(--dron)">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4"/><circle cx="25" cy="7" r="4"/><circle cx="7" cy="25" r="4"/><circle cx="25" cy="25" r="4"/><path d="M10 10l12 12M22 10L10 22"/><rect x="13" y="13" width="6" height="6" rx="1.5" fill="currentColor"/></svg>
      Dron<small class="padsub"></small></button>
    <button class="pad" data-cat="chill" style="--c:var(--chill)">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22c4-3 8-3 12 0s8 3 12 0"/><path d="M16 4l-6 12h12z"/><path d="M16 16v3"/></svg>
      Chill<small class="padsub"></small></button>
    <button class="pad" data-cat="cozy" style="--c:var(--cozy)">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13h17v7a7 7 0 0 1-7 7h-3a7 7 0 0 1-7-7z"/><path d="M23 15h2a3 3 0 0 1 0 6h-2"/><path d="M11 4c0 2 2 2 2 4M16 4c0 2 2 2 2 4"/></svg>
      Cozy<small class="padsub"></small></button>
  </nav>
</div>

<script>
/* ---------- ekran startowy ---------- */
(function(){
  const sp = document.getElementById("splash"); if(!sp) return;
  const quick = /^#(dron|chill|cozy)$/i.test(location.hash) || /[?&](text|url|title)=/.test(location.search);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hide = () => { sp.classList.add("out"); setTimeout(() => sp.remove(), 400); };
  if(quick){ sp.remove(); return; }
  sp.addEventListener("click", hide);
  setTimeout(hide, reduce ? 1100 : 2100);
})();
/*OLC*/
(function(){
"use strict";
const CATS = {dron:{label:"Dron",color:"--dron"}, chill:{label:"Chill",color:"--chill"}, cozy:{label:"Cozy",color:"--cozy"}};
const ICONS = {};
document.querySelectorAll(".pad").forEach(b => ICONS[b.dataset.cat] = b.querySelector("svg").outerHTML);
const KEY = "xmarks.v1", OLD_KEY = "pinezki.v1", VIEW_KEY = "xmarks.view", SWIPE_KEY = "xmarks.swiped";
const $ = s => document.querySelector(s);
const inFrame = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
let places = load();
let filter = "all", view = ["list","tiles","map"].includes(ls.get(VIEW_KEY)) ? ls.get(VIEW_KEY) : "list", sortNear = false;
let lastFix = null, gpsOk = null;    // gpsOk: null = nie wiadomo, true, false
let map = null, layer = null, pendingHash = null;

/* ---------- storage ---------- */
function load(){
  try{
    const r = ls.get(KEY) || ls.get(OLD_KEY); const a = r ? JSON.parse(r) : [];
    return Array.isArray(a) ? a.filter(p => p && p.id && CATS[p.cat] && !String(p.id).startsWith("ex")) : [];
  }catch(e){ return []; }
}
function save(){ ls.set(KEY, JSON.stringify(places)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- zdjęcia (IndexedDB) ---------- */
const PhotoDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("xmarks", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error); };
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("photos", mode), req = fn(t.objectStore("photos"));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    get: id => run("readonly", s => s.get(id)),
    put: (id, blob) => run("readwrite", s => s.put(blob, id)),
    del: id => run("readwrite", s => s.delete(id))
  };
})();
const photoURLs = new Map();
async function photoURL(id){
  if(photoURLs.has(id)) return photoURLs.get(id);
  try{ const b = await PhotoDB.get(id); if(!b) return null; const u = URL.createObjectURL(b); photoURLs.set(id, u); return u; }
  catch(e){ return null; }
}
function dropPhotoURL(id){ const u = photoURLs.get(id); if(u){ URL.revokeObjectURL(u); photoURLs.delete(id); } }
function fillPhotos(root){
  root.querySelectorAll("img[data-photo]").forEach(async img => {
    const u = await photoURL(img.dataset.photo);
    if(u) img.src = u; else img.remove();
  });
}
async function shrink(file, max = 1400){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", .82));
    if(!b) throw new Error("toBlob");
    return b;
  }finally{ URL.revokeObjectURL(url); }
}
function pickFile(cb){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.hidden = true;
  inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if(f) cb(f); };
  document.body.appendChild(inp); inp.click();
}
async function setCover(id, file){
  try{
    const b = await shrink(file); await PhotoDB.put(id, b);
    const p = places.find(x => x.id === id); if(p){ p.photo = true; dropPhotoURL(id); save(); render(); }
    return true;
  }catch(e){ toast({title:"Nie zapisano zdjęcia", sub:"Ta przeglądarka nie pozwala trzymać zdjęć (tryb prywatny?)."}); return false; }
}

/* ---------- GPS ---------- */
function setGps(state, html){ $("#gpsDot").className = "dot " + state; $("#gpsTxt").innerHTML = html; }
function gpsDown(reason){
  gpsOk = false;
  setGps("bad", reason);
  const h = $("#gpsHint");
  h.textContent = inFrame
    ? "Ten podgląd nie ma dostępu do GPS. Przycisk kategorii otworzy dodawanie z linku lub nazwy. Pełna wersja z GPS: bol0r.github.io/x-marks"
    : "Telefon nie podaje lokalizacji. Włącz ją dla przeglądarki w Ustawieniach, a do tego czasu przyciski otworzą dodawanie z linku lub nazwy.";
  h.hidden = false;
  document.querySelectorAll(".padsub").forEach(s => s.textContent = "z linku");
  if(pendingHash){ const c = pendingHash; pendingHash = null; pasteSheet(c); }
}
function onFix(p){
  const first = !lastFix;
  lastFix = {lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy), t:Date.now()};
  gpsOk = true; $("#gpsHint").hidden = true;
  document.querySelectorAll(".padsub").forEach(s => s.textContent = "");
  setGps(lastFix.acc <= 30 ? "ok" : "warn", "<b>±" + lastFix.acc + " m</b>&nbsp;" + olcEncode(lastFix.lat, lastFix.lng));
  if(pendingHash){ const c = pendingHash; pendingHash = null; addAtHere(c, document.querySelector(`.pad[data-cat="${c}"]`)); }
  else if(first || sortNear) render();
}
function startWatch(){
  if(!("geolocation" in navigator)){ gpsDown("GPS: brak"); return; }
  try{
    navigator.geolocation.watchPosition(onFix, err => {
      if(err.code === 1 || !lastFix) gpsDown(err.code === 1 ? "GPS: zablokowany" : "GPS: brak sygnału");
    }, {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
  }catch(e){ gpsDown("GPS: brak"); }
}
function getFix(){
  if(lastFix && Date.now() - lastFix.t < 15000) return Promise.resolve(lastFix);
  return new Promise((res, rej) => {
    if(gpsOk === false || !("geolocation" in navigator)) return rej(new Error("nogeo"));
    try{ navigator.geolocation.getCurrentPosition(p => { onFix(p); res(lastFix); }, rej, {enableHighAccuracy:true, maximumAge:15000, timeout:12000}); }
    catch(e){ rej(e); }
  });
}

/* ---------- dodawanie ---------- */
function addPlace(cat, lat, lng, acc, src, name){
  const p = {id:uid(), cat, lat:+(+lat).toFixed(6), lng:+(+lng).toFixed(6), acc:acc ?? null, ts:Date.now(), name:name || "", note:"", addr:"", src:src || "gps"};
  places.unshift(p); save(); render(); savedToast(p); reverseGeocode(p);
  try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
  return p;
}
async function addAtHere(cat, btn){
  if(btn) btn.disabled = true;
  try{ const f = await getFix(); addPlace(cat, f.lat, f.lng, f.acc, "gps"); }
  catch(e){ pasteSheet(cat); }
  finally{ if(btn) btn.disabled = false; }
}
async function reverseGeocode(p){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=pl&lat=${p.lat}&lon=${p.lng}`);
    if(!r.ok) return;
    const j = await r.json(), a = j.address || {};
    const parts = [a.road || a.hamlet || a.neighbourhood || a.suburb || a.village, a.suburb !== (a.road || a.hamlet) ? a.suburb : null, a.city || a.town || a.village || a.county];
    const addr = [...new Set(parts.filter(Boolean))].slice(0, 3).join(", ");
    const it = places.find(x => x.id === p.id);
    if(addr && it){ it.addr = addr; save(); render(); }
  }catch(e){ /* offline: zostają współrzędne i Plus Code */ }
}
// wyszukiwanie miejsca po nazwie / adresie (OpenStreetMap)
async function geocode(q, signal){
  const tries = [q.parts.join(", "), q.parts.slice(1).join(", "), q.parts[0]].filter((v, i, a) => v && a.indexOf(v) === i);
  const ref = refPoint();
  for(let i = 0; i < tries.length; i++){
    if(i) await new Promise(r => setTimeout(r, 1100));   // limit Nominatim: 1 zapytanie/s
    let url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=pl&q=${encodeURIComponent(tries[i])}`;
    if(ref) url += `&viewbox=${ref.lng - 1},${ref.lat + .7},${ref.lng + 1},${ref.lat - .7}`;
    const r = await fetch(url, {signal}); if(!r.ok) continue;
    const j = await r.json();
    if(j && j[0]) return {lat:+j[0].lat, lng:+j[0].lon, src:"wyszukiwanie", label:j[0].display_name};
  }
  return null;
}
function refPoint(){
  if(lastFix) return {lat:lastFix.lat, lng:lastFix.lng, label:"Twoja pozycja"};
  if(places.length) return {lat:places[0].lat, lng:places[0].lng, label:"ostatnie miejsce"};
  return null;
}

/* ---------- archiwum, usuwanie, cofanie ---------- */
function archive(id){
  const p = places.find(x => x.id === id); if(!p) return;
  const was = !!p.archived; p.archived = !was; save(); render();
  toast({title: was ? "Przywrócono" : "Zarchiwizowano", sub:titleOf(p), actions:[{label:"Cofnij", fn:() => { p.archived = was; save(); render(); }}]});
}
function remove(id){
  const i = places.findIndex(x => x.id === id); if(i < 0) return;
  const [p] = places.splice(i, 1); save(); render();
  toast({title:"Usunięto", sub:titleOf(p), ms:8000,
    actions:[{label:"Cofnij", fn:() => { places.splice(Math.min(i, places.length), 0, p); save(); render(); }}],
    onExpire:() => { if(p.photo){ PhotoDB.del(p.id).catch(() => {}); dropPhotoURL(p.id); } }});
}

/* ---------- toast ---------- */
let cur = null;
function toast({title, sub = "", actions = [], ms = 6000, onExpire = null}){
  closeToast();
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = `<p>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}</p>` + actions.map((a, i) => `<button data-i="${i}">${esc(a.label)}</button>`).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest("button[data-i]"); if(!b) return;
    const a = actions[+b.dataset.i];
    const undo = a.label === "Cofnij";
    closeToast(!undo);
    a.fn();
  });
  document.body.appendChild(el);
  cur = {el, onExpire, timer:setTimeout(() => closeToast(), ms)};
}
function closeToast(expire = true){
  if(!cur) return;
  const c = cur; cur = null;
  clearTimeout(c.timer); c.el.remove();
  if(expire && c.onExpire) c.onExpire();
}
function savedToast(p){
  toast({title:"Zapisano: " + CATS[p.cat].label, sub:(p.acc != null ? "±" + p.acc + " m · " : "") + (p.name || olcEncode(p.lat, p.lng)),
    actions:[
      {label:"Foto", fn:() => pickFile(f => setCover(p.id, f))},
      {label:"Opis", fn:() => editSheet(p.id)},
      {label:"Cofnij", fn:() => { places = places.filter(x => x.id !== p.id); save(); render(); }}
    ]});
}

/* ---------- arkusze ---------- */
function sheet(html, onReady, onClose){
  const s = document.createElement("div");
  s.className = "sheet"; s.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  const keys = e => { if(e.key === "Escape") close(); };
  function close(){ if(!s.isConnected) return; s.remove(); document.removeEventListener("keydown", keys); onClose && onClose(); }
  s.addEventListener("click", e => { if(e.target === s) close(); });
  document.addEventListener("keydown", keys);
  document.body.appendChild(s); onReady(s, close); return close;
}
function segHTML(id, chosen){
  return `<div class="seg" id="${id}">${Object.keys(CATS).map(k => `<button type="button" data-c="${k}" style="--c:var(${CATS[k].color})" aria-pressed="${k === chosen}">${CATS[k].label}</button>`).join("")}</div>`;
}
function wireSeg(s, id, onPick){
  s.querySelector("#" + id).addEventListener("click", e => {
    const b = e.target.closest("button[data-c]"); if(!b) return;
    s.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
    onPick(b.dataset.c);
  });
}

function editSheet(id){

function pasteSheet(cat, prefill){
  let chosen = cat || (CATS[filter] ? filter : "dron"), parsed = null, ctrl = null, timer = null, nameTouched = false;
  sheet(`<h2>Dodaj miejsce</h2>
    <p>Wklej to, co daje „Udostępnij” w Mapach Google lub Apple, Plus Code, współrzędne albo wpisz nazwę miejsca.</p>
    <div class="inrow">
      <textarea id="pasteIn" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="np. Hala Stulecia albo 425J+XR Wrocław"></textarea>
      <button type="button" class="btn" id="clipBtn">Wklej</button>
    </div>
    <div class="preview" id="pastePrev" aria-live="polite">Czekam na pozycję…</div>
    <input type="text" id="pasteName" placeholder="Nazwa (opcjonalnie)">
    ${segHTML("pasteCat", chosen)}
    <div class="row"><button type="button" class="btn" data-a="x">Anuluj</button><button type="button" class="btn primary" data-a="ok" disabled>Dodaj</button></div>`,
  (s, close) => {
    const inp = s.querySelector("#pasteIn"), prev = s.querySelector("#pastePrev"), ok = s.querySelector('[data-a="ok"]'), nameIn = s.querySelector("#pasteName");
    const neutral = t => { prev.className = "preview"; prev.textContent = t; };
    const bad = t => { prev.className = "preview bad"; prev.textContent = t; };
    const good = r => {
      parsed = r; ok.disabled = false; prev.className = "preview good";
      prev.innerHTML = `<b>Mam to</b> · ${esc(r.src)}${r.info ? " · " + esc(r.info) : ""}${r.label ? "<br>" + esc(r.label) : ""}<br>${r.lat.toFixed(5)}, ${r.lng.toFixed(5)} · ${olcEncode(r.lat, r.lng)}${lastFix ? " · " + fmtDist(dist(lastFix, r)) + " stąd" : ""}`;
    };
    const setName = n => { if(n && !nameTouched) nameIn.value = n; };
    const check = () => {
      clearTimeout(timer); if(ctrl){ ctrl.abort(); ctrl = null; }
      parsed = null; ok.disabled = true;
      const r = parsePlace(inp.value, refPoint());
      if(r.lat != null){ setName(r.name); good(r); return; }
      if(r.error === ""){ neutral("Czekam na pozycję…"); return; }
      if(r.query){
        setName(r.query.name);
        neutral("Szukam: " + r.query.parts.join(", ") + "…");
        timer = setTimeout(async () => {
          ctrl = new AbortController();
          try{
            const g = await geocode(r.query, ctrl.signal);
            if(g) good(g);
            else bad("Nie znalazłem tego miejsca. Dopisz miasto albo wklej współrzędne z karty miejsca.");
          }catch(e){ if(e.name !== "AbortError") bad("Wyszukiwanie po nazwie wymaga internetu. Wklej współrzędne albo Plus Code."); }
        }, 650);
        return;
      }
      bad(r.error);
    };
    inp.addEventListener("input", check);
    nameIn.addEventListener("input", () => { nameTouched = true; });
    s.querySelector("#clipBtn").onclick = async () => {
      try{ const t = await navigator.clipboard.readText(); if(t){ inp.value = t; check(); return; } }catch(e){}
      inp.focus(); neutral("Przytrzymaj pole powyżej i wybierz Wklej.");
    };
    wireSeg(s, "pasteCat", c => { chosen = c; });
    s.querySelector('[data-a="x"]').onclick = close;
    ok.onclick = () => { if(!parsed) return; const n = nameIn.value.trim(); close(); addPlace(chosen, parsed.lat, parsed.lng, null, parsed.src, n); };
    if(prefill){ inp.value = prefill; check(); } else inp.focus();
  },
  () => { clearTimeout(timer); if(ctrl) ctrl.abort(); });
}

/* ---------- kopia zapasowa ---------- */
const BK = "xmarks.lastBackup";
function getLastBackup(){ try{ return JSON.parse(ls.get(BK) || "null"); }catch(e){ return null; } }
function lastBackupTxt(){ const b = getLastBackup(); return b ? fmtWhen(b.ts) + ` (${b.n} szt.)` : "nigdy"; }
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function dataURLToBlob(u){
  const [head, b64] = u.split(","); const type = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type});
}
async function backupJSON(){
  const photos = {};
  for(const p of places.filter(p => p.photo)){
    try{ const b = await PhotoDB.get(p.id); if(b) photos[p.id] = await blobToDataURL(b); }catch(e){}
  }
  return JSON.stringify({app:"x-marks", v:2, exported:new Date().toISOString(), places, photos});
}
async function importBackup(data){
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.places) ? data.places : null);
  if(!arr) throw new Error("format");
  const photos = (data && data.photos) || {};
  const ids = new Set(places.map(p => p.id)); let n = 0;
  for(const p of arr){
    if(!(p && p.id && CATS[p.cat] && isFinite(p.lat) && isFinite(p.lng)) || ids.has(p.id)) continue;
    const q = Object.assign({}, p);
    if(photos[p.id]){ try{ await PhotoDB.put(p.id, dataURLToBlob(photos[p.id])); q.photo = true; }catch(e){ q.photo = false; } }
    else q.photo = false;
    places.push(q); n++;
  }
  places.sort((a, b) => b.ts - a.ts); save(); render();
  return n;
}
async function backup(msg){
  const stamp = new Date().toISOString().slice(0, 10), name = `xmarks-${stamp}.json`;
  msg && msg("Przygotowuję kopię…");
  const text = await backupJSON();
  const file = new File([text], name, {type:"application/json"});
  const mark = () => { ls.set(BK, JSON.stringify({ts:Date.now(), n:places.length})); renderBackupHint(); };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"X Marks – kopia " + stamp});
      mark(); msg && msg("Kopia zapisana."); return;
    }
  }catch(e){ if(e && e.name === "AbortError"){ msg && msg("Anulowano."); return; } }
  await dl(name, text, "application/json", msg); mark(); msg && msg("Plik " + name + " pobrany.");
}
function renderBackupHint(){
  const el = $("#backupHint"); if(!el) return;
  const b = getLastBackup();
  el.hidden = !(places.length >= 3 && (!b || (Date.now() - b.ts > 7 * 864e5 && places.length !== b.n)));
}
async function dl(name, text, type, msg){
  const blob = new Blob([text], {type});
  try{
    const d = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(d){ await d.save({filename:name, data:blob}); return; }
  }catch(e){ msg && msg("Nie zapisano pliku."); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function toGPX(){
  const wpts = places.map(p => `  <wpt lat="${p.lat}" lon="${p.lng}"><time>${new Date(p.ts).toISOString()}</time><name>${esc(CATS[p.cat].label + " · " + titleOf(p))}</name><desc>${esc(p.note)}</desc><type>${p.cat}</type></wpt>`).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="X Marks" xmlns="http://www.topografix.com/GPX/1/1">\n${wpts}\n</gpx>`;
}

/* ---------- pomocnicze ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtCoords = p => `${(+p.lat).toFixed(5)}, ${(+p.lng).toFixed(5)}`;
const titleOf = p => p.name || p.addr || olcEncode(p.lat, p.lng);
const shareText = p => `${titleOf(p)}\n${olcEncode(p.lat, p.lng)} (${fmtCoords(p)})\nhttps://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
function dist(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 25 ? "tutaj" : m < 1000 ? Math.round(m / 10) * 10 + " m" : (m < 10000 ? (m / 1000).toFixed(1).replace(".", ",") : Math.round(m / 1000)) + " km";
function fmtWhen(ts){
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString("pl-PL", {hour:"2-digit", minute:"2-digit"});
  if(d.toDateString() === now.toDateString()) return "dziś " + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if(d.toDateString() === y.toDateString()) return "wczoraj " + hm;
  return d.toLocaleDateString("pl-PL", {day:"numeric", month:"short"}) + " " + hm;
}
async function copy(text, btn){
  const old = btn.textContent;
  try{ await navigator.clipboard.writeText(text); btn.textContent = "Skopiowano"; }
  catch(e){ btn.textContent = "Schowek zablokowany"; }
  setTimeout(() => { if(btn.isConnected) btn.textContent = old; }, 1600);
}

/* ---------- widok ---------- */
function visible(){
  let arr = filter === "arch" ? places.filter(p => p.archived) : places.filter(p => !p.archived && (filter === "all" || p.cat === filter));
  if(sortNear && lastFix) arr = arr.slice().sort((a, b) => dist(lastFix, a) - dist(lastFix, b));
  return arr;
}
function itemHTML(p){
  const nav = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  const sub = [p.name && p.addr ? p.addr : "", lastFix ? fmtDist(dist(lastFix, p)) : ""].filter(Boolean).join(" · ");
  return `<div class="sw" data-id="${esc(p.id)}">
    <div class="sw-bg" aria-hidden="true"><span class="sw-del">Usuń</span><span class="sw-arch">${p.archived ? "Przywróć" : "Archiwizuj"}</span></div>
    <article class="item" style="--c:var(${CATS[p.cat].color})">
      <div class="bar"></div>
      <div style="min-width:0">
        <div class="top"><span class="cat">${CATS[p.cat].label}</span><span class="when">${fmtWhen(p.ts)}</span></div>
        <p class="name">${esc(titleOf(p))}</p>
        ${sub ? `<p class="sub">${esc(sub)}</p>` : ""}
        <div class="coords">${olcEncode(p.lat, p.lng)} · ${fmtCoords(p)}${p.acc != null ? " · ±" + p.acc + " m" : ""}</div>
        ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
        <div class="acts">
          <a href="${nav}" target="_blank" rel="noopener">Prowadź</a>
          <button type="button" data-a="copy">Kopiuj</button>
          <button type="button" data-a="edit">Edytuj</button>
        </div>
      </div>
      ${p.photo ? `<img class="thumb" alt="" data-photo="${esc(p.id)}">` : ""}
    </article></div>`;
}
function tileHTML(p){
  const sub = lastFix ? fmtDist(dist(lastFix, p)) : fmtWhen(p.ts);
  return `<button type="button" class="tile" style="--c:var(${CATS[p.cat].color})" data-id="${esc(p.id)}">
    ${p.photo ? `<img alt="" data-photo="${esc(p.id)}">` : `<span class="ph">${ICONS[p.cat]}</span>`}
    <span class="meta"><span class="pill">${CATS[p.cat].label}</span><span class="tname">${esc(titleOf(p))}</span><span class="tsub">${esc(sub)}</span></span>
  </button>`;
}
function render(){
  const active = places.filter(p => !p.archived), archN = places.length - active.length;
  const counts = {all:active.length, dron:0, chill:0, cozy:0, arch:archN};
  active.forEach(p => counts[p.cat]++);
  Object.keys(counts).forEach(k => $("#n-" + k).textContent = counts[k]);
  $("#archChip").hidden = !archN && filter !== "arch";
  $("#sortBtn").hidden = !(lastFix && places.length);
  document.querySelectorAll("#viewSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === view));
  const box = $("#items");
  box.className = view === "tiles" ? "tiles" : "list";
  box.hidden = view === "map"; $("#mapWrap").hidden = view !== "map";
  const shown = visible();
  if(!places.length){
    box.innerHTML = `<div class="empty">
      <h2>Nie masz jeszcze miejsc</h2>
      <ol class="steps">
        <li>Jesteś w fajnym miejscu: stuknij <b>Dron</b>, <b>Chill</b> albo <b>Cozy</b>. Pozycja i godzina zapiszą się same.</li>
        <li>Z dymka „Zapisano” od razu dodasz <b>zdjęcie</b> albo opis.</li>
        <li>Miejsce z Map Google dodasz przez <b>Dodaj</b>: wklej udostępniony link albo wpisz nazwę.</li>
      </ol>
      <div class="formats">Dodaj rozumie:<br>„Udostępnij” z Map Google / Apple<br>nazwę miejsca: Hala Stulecia<br>Plus Code: 425J+XR Wrocław<br>51.10994, 17.03203 · 51°06'36"N 17°01'55"E</div>
    </div>`;
  }else if(!shown.length){
    box.innerHTML = `<div class="empty"><p class="hint">${filter === "arch" ? "Archiwum jest puste." : "Brak miejsc w tej kategorii."}</p></div>`;
  }else if(view === "tiles"){
    box.innerHTML = shown.map(tileHTML).join("");
  }else{
    const hint = !ls.get(SWIPE_KEY) ? `<p class="hint swipe-hint">← przesuń: ${filter === "arch" ? "przywróć" : "archiwizuj"} · usuń: przesuń →</p>` : "";
    box.innerHTML = hint + shown.map(itemHTML).join("");
  }
  fillPhotos(box);
  if(view === "map") drawMap();
  renderBackupHint();
}

/* ---------- kliknięcia i przesuwanie na liście ---------- */
const box = $("#items");
let sw = null, justDragged = false;
box.addEventListener("click", e => {
  if(justDragged){ e.preventDefault(); return; }
  if(e.target.closest("a")) return;
  const tile = e.target.closest(".tile"); if(tile){ editSheet(tile.dataset.id); return; }
  const wrap = e.target.closest(".sw"); if(!wrap) return;
  const id = wrap.dataset.id, p = places.find(x => x.id === id); if(!p) return;
  const b = e.target.closest("button[data-a]");
  if(b && b.dataset.a === "copy"){ copy(shareText(p), b); return; }
  editSheet(id);
});
box.addEventListener("pointerdown", e => {
  if(view !== "list" || (e.pointerType === "mouse" && e.button !== 0)) return;
  const wrap = e.target.closest(".sw"); if(!wrap || e.target.closest("a,button")) return;
  sw = {wrap, card:wrap.querySelector(".item"), x:e.clientX, y:e.clientY, dx:0, on:false, pid:e.pointerId};
});
box.addEventListener("pointermove", e => {
  if(!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if(!sw.on){
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
    if(Math.abs(dx) < 10) return;
    sw.on = true; sw.card.classList.add("dragging");
    try{ sw.card.setPointerCapture(e.pointerId); }catch(_){}
  }
  sw.dx = dx;
  sw.card.style.transform = `translateX(${dx}px)`;
  sw.wrap.dataset.dir = dx < 0 ? "left" : "right";
  sw.wrap.classList.toggle("armed", Math.abs(dx) > sw.wrap.offsetWidth * .3);
});
function swipeEnd(e){
  if(!sw || e.pointerId !== sw.pid) return;
  const s = sw; sw = null;
  if(!s.on) return;
  justDragged = true; setTimeout(() => { justDragged = false; }, 60);
  s.card.classList.remove("dragging");
  const w = s.wrap.offsetWidth;
  if(Math.abs(s.dx) > w * .3){
    s.card.style.transform = `translateX(${s.dx < 0 ? -w : w}px)`;
    s.wrap.classList.add("gone");
    ls.set(SWIPE_KEY, "1");
    try{ navigator.vibrate && navigator.vibrate(20); }catch(_){}
    const id = s.wrap.dataset.id;
    setTimeout(() => s.dx < 0 ? archive(id) : remove(id), 170);
  }else{
    s.card.style.transform = "";
    setTimeout(() => { delete s.wrap.dataset.dir; s.wrap.classList.remove("armed"); }, 200);
  }
}
box.addEventListener("pointerup", swipeEnd);
box.addEventListener("pointercancel", swipeEnd);

/* ---------- mapa ---------- */
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  return new Promise((res, rej) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function drawMap(){
  try{ await loadLeaflet(); }catch(e){ $("#mapNote").textContent = "Mapa niedostępna offline. Lista działa normalnie."; return; }
  if(!map){
    map = L.map("map", {zoomControl:false});
    const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
    tiles.on("tileerror", () => { $("#mapNote").textContent = inFrame ? "W podglądzie Claude podkład mapy się nie wczytuje. Na bol0r.github.io/x-marks działa." : "Podkład mapy się nie wczytał (brak internetu)."; });
    layer = L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  const cs = getComputedStyle(document.documentElement);
  const shown = visible();
  shown.forEach(p => {
    L.circleMarker([p.lat, p.lng], {radius:9, weight:2, color:"#fff", fillColor:cs.getPropertyValue(CATS[p.cat].color).trim(), fillOpacity:1})
      .bindPopup(`<b>${CATS[p.cat].label}</b><br>${esc(titleOf(p))}${p.note ? "<br>" + esc(p.note) : ""}<br><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">Prowadź</a>`)
      .addTo(layer);
  });
  if(lastFix) L.circleMarker([lastFix.lat, lastFix.lng], {radius:6, color:"#5ab4ff", weight:3, fillOpacity:.3}).addTo(layer);
  setTimeout(() => {
    map.invalidateSize();
    if(shown.length) map.fitBounds(shown.map(p => [p.lat, p.lng]), {padding:[30,30], maxZoom:15});
    else map.setView(lastFix ? [lastFix.lat, lastFix.lng] : [51.107, 17.038], 12);
  }, 50);
}

/* ---------- start ---------- */
document.querySelectorAll(".pad").forEach(b => b.addEventListener("click", () => {
  if(gpsOk === false) pasteSheet(b.dataset.cat); else addAtHere(b.dataset.cat, b);
}));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  render();
}));
$("#viewSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if(!b) return;
  view = b.dataset.v; ls.set(VIEW_KEY, view); render();
});
$("#sortBtn").addEventListener("click", () => { sortNear = !sortNear; $("#sortBtn").setAttribute("aria-pressed", sortNear); render(); });
$("#pasteBtn").addEventListener("click", () => pasteSheet());
$("#moreBtn").addEventListener("click", dataSheet);
$("#backupNow").addEventListener("click", () => backup());
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

// szybki zapis z ikonki / Skrótu: adres#dron, #chill, #cozy
const h = (location.hash || "").slice(1).toLowerCase();
if(CATS[h]){ pendingHash = h; try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }
// „Udostępnij → X Marks” (Android, zainstalowana apka)
const qs = new URLSearchParams(location.search);
const shared = ["title", "text", "url"].map(k => qs.get(k)).filter(Boolean).join("\n");
if(shared){ try{ history.replaceState(null, "", location.pathname); }catch(e){} }

if("serviceWorker" in navigator && location.protocol === "https:" && !inFrame){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
save();
render();
startWatch();
if(shared) pasteSheet(null, shared);
})();
</script>
